<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Trading V3 Test - Mission Control</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #888; margin-bottom: 30px; font-size: 14px; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
        }
        
        .stat-card h2 {
            font-size: 18px;
            color: #888;
            margin-bottom: 15px;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #222;
        }
        
        .stat-row:last-child { border-bottom: none; }
        .stat-label { color: #888; }
        .stat-value { font-weight: 600; }
        .stat-value.positive { color: #10b981; }
        .stat-value.negative { color: #ef4444; }
        
        .version-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }
        .version-badge.v2 { background: #374151; color: #9ca3af; }
        .version-badge.v3 { background: #7c3aed; color: #fff; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
        }
        
        th {
            background: #222;
            padding: 12px;
            text-align: left;
            font-size: 12px;
            text-transform: uppercase;
            color: #888;
            font-weight: 600;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #222;
        }
        
        tr:last-child td { border-bottom: none; }
        tr:hover { background: #222; }
        
        .direction {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }
        .direction.LONG { background: #10b98122; color: #10b981; }
        .direction.SHORT { background: #ef444422; color: #ef4444; }
        
        .pnl.positive { color: #10b981; font-weight: 600; }
        .pnl.negative { color: #ef4444; font-weight: 600; }
        
        .last-updated {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: 20px;
        }
        
        .partial-badge {
            display: inline-block;
            padding: 2px 8px;
            background: #f59e0b22;
            color: #f59e0b;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Paper Trading V3 Test</h1>
        <p class="subtitle">Stochastic Oscillator: V2 vs V3 Comparison</p>
        
        <div class="stats-grid" id="stats-grid"></div>
        
        <h2 style="margin-bottom: 15px; color: #888;">Trade History</h2>
        <table id="trades-table">
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Version</th>
                    <th>Side</th>
                    <th>Entry</th>
                    <th>Exit</th>
                    <th>P/L</th>
                    <th>Reason</th>
                </tr>
            </thead>
            <tbody id="trades-body"></tbody>
        </table>
        
        <div class="last-updated" id="last-updated"></div>
    </div>
    
    <script>
        async function loadData() {
            try {
                const [comparison, trades] = await Promise.all([
                    fetch('/src/data/paper_comparison.json').then(r => r.json()),
                    fetch('/src/data/paper_trades.json').then(r => r.json())
                ]);
                
                renderStats(comparison);
                renderTrades(trades);
                
                document.getElementById('last-updated').textContent = 
                    `Last updated: ${new Date(comparison.last_updated).toLocaleString()}`;
            } catch (err) {
                console.error('Failed to load data:', err);
            }
        }
        
        function renderStats(comparison) {
            const statsGrid = document.getElementById('stats-grid');
            
            const v2Card = createStatCard('V2 Performance (Mar 20-27)', comparison.v2, 'v2');
            const v3Card = createStatCard('V3 Performance (Mar 27-Apr 1)', comparison.v3, 'v3');
            
            statsGrid.innerHTML = '';
            statsGrid.appendChild(v2Card);
            statsGrid.appendChild(v3Card);
        }
        
        function createStatCard(title, stats, version) {
            const card = document.createElement('div');
            card.className = 'stat-card';
            
            const winRateClass = stats.win_rate >= 60 ? 'positive' : stats.win_rate >= 50 ? '' : 'negative';
            const pnlClass = stats.total_pnl > 0 ? 'positive' : stats.total_pnl < 0 ? 'negative' : '';
            
            card.innerHTML = `
                <h2>${title} <span class="version-badge ${version}">${version.toUpperCase()}</span></h2>
                <div class="stat-row">
                    <span class="stat-label">Total Trades</span>
                    <span class="stat-value">${stats.trades}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Win Rate</span>
                    <span class="stat-value ${winRateClass}">${stats.win_rate}%</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Wins / Losses</span>
                    <span class="stat-value">${stats.wins}W / ${stats.losses}L</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Total P/L</span>
                    <span class="stat-value ${pnlClass}">$${stats.total_pnl.toFixed(2)}</span>
                </div>
            `;
            
            return card;
        }
        
        function renderTrades(trades) {
            const tbody = document.getElementById('trades-body');
            tbody.innerHTML = '';
            
            trades.forEach(trade => {
                const row = document.createElement('tr');
                const pnlClass = trade.pnl > 0 ? 'positive' : trade.pnl < 0 ? 'negative' : '';
                const partialBadge = trade.partial_tp ? '<span class="partial-badge">PARTIAL TP</span>' : '';
                
                row.innerHTML = `
                    <td>${new Date(trade.timestamp).toLocaleString()}</td>
                    <td><span class="version-badge ${trade.version}">${trade.version.toUpperCase()}</span></td>
                    <td><span class="direction ${trade.direction}">${trade.direction}</span></td>
                    <td>$${trade.entry.toFixed(2)}</td>
                    <td>$${trade.exit.toFixed(2)}</td>
                    <td class="pnl ${pnlClass}">$${trade.pnl.toFixed(2)}${partialBadge}</td>
                    <td>${trade.exit_reason}</td>
                `;
                
                tbody.appendChild(row);
            });
        }
        
        // Load data on page load
        loadData();
        
        // Refresh every 30 seconds
        setInterval(loadData, 30000);
    </script>
</body>
</html>
